name: Build release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build payload
        run: ./scripts/build-release.sh
      - name: Read release metadata
        id: metadata
        run: |
          metadata=$(find dist -name 'taobao-linux-*.json' -print -quit)
          echo "version=$(jq -r .version "$metadata")" >> "$GITHUB_OUTPUT"
          echo "payload=$(jq -r .payload "$metadata")" >> "$GITHUB_OUTPUT"
      - name: Publish payload release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          PAYLOAD: ${{ steps.metadata.outputs.payload }}
        run: |
          tag="taobao-$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Taobao Linux $VERSION" \
              --notes "Linux payload built by GitHub Actions from the official Taobao Windows installer."
          fi
          gh release upload "$tag" "dist/$PAYLOAD" --clobber
