name: Build release

on:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Rebuild an already released version under a new tag
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: taobao-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check upstream version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          version=$(./scripts/build-release.sh --version-only)
          tag="taobao-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$REBUILD" != "true" ]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Taobao $version is already released; nothing to do."
              exit 0
            fi

            suffix=2
            while gh release view "$tag-$suffix" >/dev/null 2>&1; do
              suffix=$((suffix + 1))
            done
            tag="$tag-$suffix"
            echo "Rebuilding Taobao $version as $tag."
          else
            echo "Building Taobao $version."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Build payload
        if: steps.check.outputs.build == 'true'
        run: ./scripts/build-release.sh
      - name: Read release metadata
        if: steps.check.outputs.build == 'true'
        id: metadata
        run: |
          metadata=$(find dist -name 'taobao-linux-*.json' -print -quit)
          echo "version=$(jq -r .version "$metadata")" >> "$GITHUB_OUTPUT"
          echo "payload=$(jq -r .payload "$metadata")" >> "$GITHUB_OUTPUT"
      - name: Publish payload release
        if: steps.check.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          TAG: ${{ steps.check.outputs.tag }}
          PAYLOAD: ${{ steps.metadata.outputs.payload }}
        run: |
          gh release create "$TAG" --title "Taobao Linux $VERSION" \
            --notes "Linux payload built by GitHub Actions from the official Taobao Windows installer." \
            "dist/$PAYLOAD"
      - name: Notify Flatpark
        if: steps.check.outputs.build == 'true'
        uses: flatpark/publish-action@v1
        continue-on-error: true
        with:
          app-id: com.taobao.Taobao.Desktop
          tag: ${{ steps.check.outputs.tag }}
